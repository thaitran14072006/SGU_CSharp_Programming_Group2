name: MocBakery CI CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: write-all

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: Build and business tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore MocBakery/MocBakery.sln

      - name: Build Release
        run: >
          dotnet build MocBakery/MocBakery.sln
          --configuration Release
          --no-restore

      - name: Test Accounts Customers and FEFO
        run: >
          dotnet
          MocBakery/tests/Unit/bin/Release/net10.0/MocBakery.UnitChecks.dll

      - name: Test Catalog and Inventory
        run: >
          dotnet
          MocBakery/tests/Unit/CatalogInventory/bin/Release/net10.0/MocBakery.CatalogInventoryChecks.dll

      - name: Test customer account business rules
        run: >
          dotnet
          MocBakery/tests/CustomerAccounts/bin/Release/net10.0/MocBakery.CustomerAccountChecks.dll

      - name: Test customer Web authentication over HTTP
        run: >
          dotnet
          MocBakery/tests/WebAccounts/bin/Release/net10.0/MocBakery.WebAccountChecks.dll

  customer-sql:
    name: Customer Web and desktop SQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          # Disposable CI service only. This is not a shared or deployment credential.
          MSSQL_SA_PASSWORD: "CI_Only_SQL_2026!Test"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CI_Only_SQL_2026!Test' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build customer Web checks with SQL driver
        run: dotnet build MocBakery/tests/WebAccounts/MocBakery.WebAccountChecks.csproj --configuration Release

      - name: Test customer Web and desktop shared SQL data
        env:
          MOCBAKERY_SQL_TEST_CONNECTION: "Server=localhost,1433;User ID=sa;Password=CI_Only_SQL_2026!Test;Encrypt=True;TrustServerCertificate=True;Connect Timeout=10"
        run: >
          dotnet
          MocBakery/tests/WebAccounts/bin/Release/net10.0/MocBakery.WebAccountChecks.dll
          --sql

  release:
    name: Publish Windows release
    needs: [verify, customer-sql]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify release commit belongs to main
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit must belong to main."
          }

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $name = "MocBakery-$env:GITHUB_RUN_ID"

          & ./MocBakery/scripts/Package-Release.ps1 -ReleaseName $name

          gh release create $env:GITHUB_REF_NAME `
            "MocBakery/artifacts/$name.zip" `
            "MocBakery/artifacts/$name.zip.sha256.txt" `
            --verify-tag `
            --generate-notes
