name: mocbakery
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mocbakery-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create a local .env file with MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
volumes:
  sqlserver_data:
